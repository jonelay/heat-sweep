# 2004 Prius IPEM thermal stack — one IGBT die, junction to coolant.
#
# Source: ORNL/TM-2010/253 Fig 2.28 + SEM Figs 2.29-2.32 (§9.3 / §11).
# Layer thicknesses marked "estimated" are standard values; only the
# 9.0 mm total path and the layer sequence/materials are ORNL-measured.
#
# Units: lengths in m, k in W/(m K), rho in kg/m^3, cp in J/(kg K).
# Layers are listed top (junction) to bottom (coolant). Each layer's
# `footprint` is "die" (die-sized), "tile" (DBA substrate tile) or
# "plate" (full modeled cold-plate region).

[geometry]
die_w_m = 12.73e-3      # MG2 inverter IGBT, 131.9 mm^2 (ORNL Table 2.5);
die_l_m = 10.4e-3       # aspect from Fig 2.24 photo (§9.1)
tile_w_m = 30.0e-3      # DBA tile: inferred from IPEM footprint, not measured
tile_l_m = 30.0e-3
plate_w_m = 40.0e-3     # modeled cold-plate unit cell (adiabatic sides)
plate_l_m = 40.0e-3
total_path_m = 9.0e-3   # ORNL measured, junction to coolant — runtime check

[boundary]
h_conv_W_m2K = 5000.0   # forced 50/50 EG-W, mid-range of 3000-8000 (§10)
T_coolant_C = 65.0      # design inlet upper bound (§9.5)

[[layer]]
name = "die"
material = "silicon"
t_m = 1.2e-3            # estimated (typical 600 V planar)
k_W_mK = 148.0
rho_kg_m3 = 2330.0
cp_J_kgK = 700.0
footprint = "die"

[[layer]]
name = "die_attach"
material = "SnAgAl_solder"
t_m = 0.1e-3            # ORNL SEM
k_W_mK = 57.0
rho_kg_m3 = 7400.0
cp_J_kgK = 220.0
footprint = "die"

[[layer]]
name = "dba_top"
material = "aluminum"
t_m = 0.3e-3            # estimated
k_W_mK = 237.0
rho_kg_m3 = 2700.0
cp_J_kgK = 900.0
footprint = "tile"

[[layer]]
name = "insulator"
material = "AlN"
t_m = 0.635e-3          # ORNL SEM confirmed material; thickness standard
k_W_mK = 175.0
rho_kg_m3 = 3260.0
cp_J_kgK = 740.0
footprint = "tile"

[[layer]]
name = "dba_bottom"
material = "aluminum"
t_m = 0.3e-3            # estimated
k_W_mK = 237.0
rho_kg_m3 = 2700.0
cp_J_kgK = 900.0
footprint = "tile"

[[layer]]
name = "substrate_solder"
material = "SnAgAl_solder"
t_m = 0.1e-3            # estimated (same solder type)
k_W_mK = 57.0
rho_kg_m3 = 7400.0
cp_J_kgK = 220.0
footprint = "tile"

[[layer]]
name = "baseplate"
material = "aluminum"
t_m = 4.0e-3            # ORNL: 3-5 mm, midpoint
k_W_mK = 237.0
rho_kg_m3 = 2700.0
cp_J_kgK = 900.0
footprint = "plate"

[[layer]]
name = "tim"
material = "ZnO_paste"
t_m = 0.075e-3          # ORNL: 0.05-0.1 mm, midpoint
k_W_mK = 7.5            # 5-10, midpoint
rho_kg_m3 = 5600.0
cp_J_kgK = 500.0
footprint = "plate"

[[layer]]
name = "heat_sink"
material = "cast_aluminum"
t_m = 2.29e-3           # remainder of the 9.0 mm measured path
k_W_mK = 170.0
rho_kg_m3 = 2700.0
cp_J_kgK = 900.0
footprint = "plate"
